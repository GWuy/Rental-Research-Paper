<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-label="Transactional outbox processing">
<rect width="1200" height="690" fill="white"/>
<defs>
<marker id="arrSolid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#233f55"/></marker>
<marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3392b"/></marker>
</defs>
<!-- Swimlane headers -->
<rect x="60" y="40" width="270" height="35" rx="6" fill="#eaf1f5" stroke="#233f55" stroke-width="2"/>
<text x="195" y="63" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172337" text-anchor="middle">Publisher service</text>
<rect x="600" y="40" width="280" height="35" rx="6" fill="#f3f6f8" stroke="#233f55" stroke-width="2"/>
<text x="740" y="63" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172337" text-anchor="middle">Apache Kafka broker</text>
<rect x="860" y="40" width="280" height="35" rx="6" fill="#eaf1f5" stroke="#233f55" stroke-width="2"/>
<text x="1000" y="63" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172337" text-anchor="middle">Consumer service</text>
<!-- Publisher local transaction -->
<rect x="55" y="105" width="280" height="125" rx="8" fill="none" stroke="#233f55" stroke-width="2" stroke-dasharray="7 5"/>
<text x="195" y="128" font-family="Arial,sans-serif" font-size="13.5" font-weight="700" fill="#233f55" text-anchor="middle">one local PostgreSQL transaction</text>
<rect x="70" y="140" width="90" height="65" rx="5" fill="#f3f6f8" stroke="#45566a" stroke-width="1.5"/>
<text x="115" y="166" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#172337" text-anchor="middle">UPDATE</text>
<text x="115" y="186" font-family="Arial,sans-serif" font-size="12.5" font-weight="400" fill="#45566a" text-anchor="middle">domain tables</text>
<rect x="180" y="140" width="140" height="65" rx="5" fill="#f3f6f8" stroke="#45566a" stroke-width="1.5"/>
<text x="250" y="162" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#172337" text-anchor="middle">INSERT outbox_event</text>
<text x="250" y="184" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#45566a" text-anchor="middle">eventId &#183; topic &#183; key &#183; payload</text>
<!-- Relay -->
<rect x="120" y="280" width="200" height="90" rx="6" fill="#eaf1f5" stroke="#233f55" stroke-width="2"/>
<text x="220" y="307" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#172337" text-anchor="middle">Outbox relay</text>
<text x="220" y="330" font-family="Arial,sans-serif" font-size="12.5" font-weight="400" fill="#45566a" text-anchor="middle">@Scheduled &#8212; poll every 1 s</text>
<text x="220" y="353" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#45566a" text-anchor="middle">Property: SKIP LOCKED lease + backoff</text>
<!-- Poll arrow -->
<path d="M250 230 L250 280" stroke="#233f55" stroke-width="2" fill="none" marker-end="url(#arrSolid)"/>
<text x="265" y="240" font-family="Arial,sans-serif" font-size="12.5" font-weight="400" fill="#233f55" text-anchor="start">poll pending</text>
<!-- Mark published arrow -->
<path d="M170 280 L170 230" stroke="#233f55" stroke-width="2" fill="none" marker-end="url(#arrSolid)"/>
<text x="160" y="240" font-family="Arial,sans-serif" font-size="12.5" font-weight="400" fill="#233f55" text-anchor="end">UPDATE published_at</text>
<!-- Send arrow -->
<path d="M320 315 L600 315" stroke="#233f55" stroke-width="2" fill="none" marker-end="url(#arrSolid)"/>
<text x="460" y="302" font-family="Arial,sans-serif" font-size="13.5" font-weight="400" fill="#233f55" text-anchor="middle">kafka.send(topic, key, payload)</text>
<text x="460" y="337" font-family="Arial,sans-serif" font-size="12.5" font-weight="400" fill="#45566a" text-anchor="middle">synchronous &#183; 10 s timeout</text>
<!-- ACK arrow -->
<path d="M600 350 L320 350" stroke="#233f55" stroke-width="2" fill="none" marker-end="url(#arrSolid)"/>
<text x="460" y="388" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#233f55" text-anchor="middle">ACK</text>
<!-- Broker -->
<rect x="600" y="280" width="280" height="120" rx="6" fill="#f3f6f8" stroke="#233f55" stroke-width="2"/>
<text x="740" y="315" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172337" text-anchor="middle">Apache Kafka</text>
<text x="740" y="343" font-family="Arial,sans-serif" font-size="13.5" font-weight="400" fill="#45566a" text-anchor="middle">topic &#8212; 3 partitions</text>
<text x="740" y="368" font-family="Arial,sans-serif" font-size="13.5" font-weight="400" fill="#45566a" text-anchor="middle">broker acknowledgement</text>
<!-- Crash notes -->
<text x="390" y="218" font-family="Arial,sans-serif" font-size="12.5" font-weight="400" fill="#b3392b" text-anchor="start">crash before ACK &#8658; row stays pending, resent next tick</text>
<text x="390" y="242" font-family="Arial,sans-serif" font-size="12.5" font-weight="400" fill="#b3392b" text-anchor="start">crash after ACK, before mark &#8658; duplicate message &#8212; consumers idempotent</text>
<!-- Delivery arrow -->
<path d="M740 400 L930 470" stroke="#233f55" stroke-width="2" fill="none" marker-end="url(#arrSolid)"/>
<text x="800" y="442" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#233f55" text-anchor="start">deliver event &#8212; at-least-once</text>
<!-- Consumer local transaction -->
<rect x="855" y="470" width="290" height="105" rx="8" fill="none" stroke="#233f55" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1000" y="492" font-family="Arial,sans-serif" font-size="13.5" font-weight="700" fill="#233f55" text-anchor="middle">one local transaction</text>
<rect x="870" y="500" width="110" height="55" rx="5" fill="#f3f6f8" stroke="#45566a" stroke-width="1.5"/>
<text x="925" y="522" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#172337" text-anchor="middle">apply</text>
<text x="925" y="541" font-family="Arial,sans-serif" font-size="12.5" font-weight="400" fill="#45566a" text-anchor="middle">business effect</text>
<rect x="995" y="500" width="135" height="55" rx="5" fill="#f3f6f8" stroke="#45566a" stroke-width="1.5"/>
<text x="1062" y="520" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#172337" text-anchor="middle">INSERT processed_event</text>
<text x="1062" y="539" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#45566a" text-anchor="middle">(event_id)</text>
<!-- Duplicate note -->
<path d="M855 545 L700 545" stroke="#233f55" stroke-width="2" stroke-dasharray="7 5" fill="none"/>
<text x="690" y="549" font-family="Arial,sans-serif" font-size="12.5" font-weight="400" fill="#233f55" text-anchor="end">duplicate eventId &#8658; no-op</text>
<!-- Failure path -->
<path d="M1000 575 L1000 600" stroke="#b3392b" stroke-width="2" fill="none" marker-end="url(#arrRed)"/>
<rect x="55" y="600" width="1090" height="60" rx="8" fill="#fdf1ef" stroke="#b3392b" stroke-width="2" stroke-dasharray="9 6"/>
<text x="600" y="632" font-family="Arial,sans-serif" font-size="14.5" font-weight="400" fill="#8c2b21" text-anchor="middle">Failure handling: 3 retries, 1 s apart &#8594; publish to &lt;topic&gt;.DLT (same partition) &#8594; redrive preserves the original eventId &#8658; reprocessing stays idempotent</text>
</svg>
